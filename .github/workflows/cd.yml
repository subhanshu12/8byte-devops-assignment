name: CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: assignment-app
  EKS_CLUSTER_NAME: assignment-eks

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker buildx build \
          --platform linux/amd64 \
          -t ${{ steps.login-ecr.outputs.registry }}/assignment-app:${{ github.sha }} \
          ./app \
          --push

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region ap-south-1 \
          --name assignment-eks

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/assignment-app \
          assignment-app=${{ steps.login-ecr.outputs.registry }}/assignment-app:${{ github.sha }} \
          -n assignment

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/assignment-app -n assignment